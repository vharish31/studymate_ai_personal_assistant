# =============================================================
# StudyMate AI: Adaptive Intelligent Study Planner
# Spring Boot Application Configuration
# =============================================================

spring.application.name=studymate-ai
server.port=8080

# -------------------------------------------------------------
# Database Configuration (MySQL Production / Default)
# -------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studymate_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# Optional Embedded Fallback Profile (H2 in-memory)
# To use H2 instead of MySQL: run with --spring.profiles.active=dev
# -------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:studymatedb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# -------------------------------------------------------------
# File Upload Configuration (Apache PDFBox & POI processing)
# -------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
studymate.upload.dir=${STUDYMATE_UPLOAD_DIR:uploads}

# -------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------
studymate.jwt.secret=9a3f2c4e6b8a1d5f7e9c2b4a6d8f1e3c5a7b9d1f3e5a7c9b1d3f5e7a9c1b3d5f
studymate.jwt.expiration-ms=86400000

# -------------------------------------------------------------
# AI Integration Configuration (Modular Interface)
# -------------------------------------------------------------
studymate.ai.provider=rule-based
# studymate.ai.api-key=${OPENAI_OR_GEMINI_API_KEY:}
